name: Build Android Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Android variant to build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      package_format:
        description: "Android package format"
        required: true
        default: "apk"
        type: choice
        options:
          - aab
          - apk

permissions:
  contents: read

jobs:
  build-android-package:
    name: Build signed Android package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_VARIANT: ${{ inputs.build_variant || 'release' }}
      PACKAGE_FORMAT: ${{ inputs.package_format || 'apk' }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://govtrackapp-juokytrr.manus.space' }}
      EXPO_PUBLIC_OAUTH_PORTAL_URL: ${{ vars.EXPO_PUBLIC_OAUTH_PORTAL_URL }}
      EXPO_PUBLIC_APP_ID: ${{ vars.EXPO_PUBLIC_APP_ID }}
      EXPO_PUBLIC_DEEP_LINK_SCHEME: ${{ vars.EXPO_PUBLIC_DEEP_LINK_SCHEME || 'abumishaal' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production authentication configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_API_BASE_URL" || { echo "::error::Missing repository variable EXPO_PUBLIC_API_BASE_URL"; exit 1; }
          case "$EXPO_PUBLIC_API_BASE_URL" in https://*) ;; *) echo "::error::EXPO_PUBLIC_API_BASE_URL must use HTTPS"; exit 1 ;; esac

      - name: Validate TypeScript and linting
        run: |
          pnpm check
          pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Validate Expo project
        run: pnpm dlx expo-doctor@1.17.11

      - name: Restore optional Firebase Android configuration
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          fi

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Restore release keystore
        if: ${{ env.BUILD_VARIANT == 'release' }}
        shell: bash
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/abu-mishal-release.jks

      - name: Configure release signing
        if: ${{ env.BUILD_VARIANT == 'release' }}
        run: node scripts/configure-android-release-signing.cjs

      - name: Assemble Android package
        id: assemble_package
        working-directory: android
        shell: bash
        run: |
          if [ "$PACKAGE_FORMAT" = "aab" ] && [ "$BUILD_VARIANT" != "release" ]; then
            echo "AAB distribution packages must use the release variant."
            exit 1
          fi
          signing_args=(
            -PABU_MISHAL_KEYSTORE_FILE=abu-mishal-release.jks
            -PABU_MISHAL_KEYSTORE_PASSWORD="$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            -PABU_MISHAL_KEY_ALIAS="$ANDROID_RELEASE_KEY_ALIAS"
            -PABU_MISHAL_KEY_PASSWORD="$ANDROID_RELEASE_KEY_PASSWORD"
          )
          if [ "$PACKAGE_FORMAT" = "aab" ]; then
            ./gradlew app:bundleRelease "${signing_args[@]}"
            echo "package_path=android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BUILD_VARIANT" = "release" ]; then
            ./gradlew app:assembleRelease "${signing_args[@]}"
            echo "package_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            ./gradlew app:assembleDebug
            echo "package_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release APK signature
        if: ${{ env.BUILD_VARIANT == 'release' && env.PACKAGE_FORMAT == 'apk' }}
        shell: bash
        env:
          APK_PATH: ${{ steps.assemble_package.outputs.package_path }}
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::Android SDK location is unavailable; release signature verification cannot run."
            exit 1
          fi

          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "::error::apksigner was not found in the installed Android SDK build-tools."
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not created at the expected path: $APK_PATH"
            exit 1
          fi

          if ! "$apksigner_path" verify --verbose --print-certs "$APK_PATH"; then
            echo "::error::Release APK signature verification failed. The artifact will not be uploaded."
            exit 1
          fi

      - name: Upload Android package artifact
        uses: actions/upload-artifact@v4
        with:
          name: abu-mishal-android-${{ env.BUILD_VARIANT }}-${{ env.PACKAGE_FORMAT }}
          path: ${{ steps.assemble_package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: ${{ always() && env.BUILD_VARIANT == 'release' }}
        shell: bash
        run: rm -f android/app/abu-mishal-release.jks
