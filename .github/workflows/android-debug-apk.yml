name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "APK variant to build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript and linting
        run: |
          pnpm check
          pnpm lint

      - name: Restore optional Firebase Android configuration
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          fi

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Restore release keystore
        if: ${{ inputs.build_variant == 'release' }}
        shell: bash
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/abu-mishal-release.jks

      - name: Configure release signing
        if: ${{ inputs.build_variant == 'release' }}
        run: node scripts/configure-android-release-signing.cjs

      - name: Assemble installable APK
        id: assemble_apk
        working-directory: android
        shell: bash
        run: |
          if [ "${{ inputs.build_variant }}" = "release" ]; then
            ./gradlew app:assembleRelease \
              -PABU_MISHAL_KEYSTORE_FILE=abu-mishal-release.jks \
              -PABU_MISHAL_KEYSTORE_PASSWORD="$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
              -PABU_MISHAL_KEY_ALIAS="$ANDROID_RELEASE_KEY_ALIAS" \
              -PABU_MISHAL_KEY_PASSWORD="$ANDROID_RELEASE_KEY_PASSWORD"
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            ./gradlew app:assembleDebug
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abu-mishal-android-${{ inputs.build_variant }}-apk
          path: ${{ steps.assemble_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
